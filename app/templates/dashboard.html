<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Дашборд пациентов</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .dashboard {
      max-width: 1000px;
      margin: 0 auto;
    }
    .filters, .form-add {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    input, select, button {
      padding: 8px;
      border-radius: 5px;
      border: none;
      outline: none;
    }
    button {
      background: #0ef;
      color: #000;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #fff;
      padding: 10px;
      text-align: center;
    }
    .status-green {
      background-color: #006400;
    }
    .status-yellow {
      background-color: #999900;
    }
    .status-red {
      background-color: #8B0000;
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>Дашборд пациентов</h1>

    <!-- Фильтры -->
    <div class="filters">
      <input type="text" id="searchName" placeholder="Поиск по имени">
      <select id="filterStatus">
        <option value="">Все статусы</option>
        <option value="green">Надёжный</option>
        <option value="yellow">Под наблюдением</option>
        <option value="red">Ненадёжный</option>
      </select>
      <input type="date" id="filterDate">
      <button onclick="fetchClients()">Применить</button>
    </div>

    <!-- Таблица -->
    <table id="clientsTable">
      <thead>
        <tr>
          <th>ФИО</th>
          <th>Номер</th>
          <th>Статус</th>
          <th>Комментарий</th>
          <th>Дата</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- Добавление -->
    <div class="form-add">
      <input type="text" id="newName" placeholder="ФИО">
      <input type="text" id="newNumber" placeholder="Номер">
      <select id="newStatus">
        <option value="green">Надёжный</option>
        <option value="yellow">Под наблюдением</option>
        <option value="red">Ненадёжный</option>
      </select>
      <input type="text" id="newComment" placeholder="Комментарий">
      <input type="date" id="newDate">
      <button onclick="addClient()">Добавить</button>
    </div>

    <!-- График -->
    <h2>Статистика</h2>
    <canvas id="statusChart"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    async function fetchClients() {
      const name = document.getElementById('searchName').value;
      const status = document.getElementById('filterStatus').value;
      const date = document.getElementById('filterDate').value;

      const query = new URLSearchParams({ name, status, date });
      const res = await fetch(`/clients?${query}`);
      const clients = await res.json();
      renderTable(clients);
      renderChart(clients);
    }

    function renderTable(clients) {
      const tbody = document.querySelector('#clientsTable tbody');
      tbody.innerHTML = '';
      clients.forEach(client => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${client.name}</td>
          <td>${client.number}</td>
          <td class="status-${client.status}">${client.status}</td>
          <td>${client.comment}</td>
          <td>${client.date}</td>
          <td>
            <button onclick="editClient(${client.id})">✏️</button>
            <button onclick="deleteClient(${client.id})">🗑️</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function addClient() {
      const payload = {
        name: document.getElementById('newName').value,
        number: document.getElementById('newNumber').value,
        status: document.getElementById('newStatus').value,
        comment: document.getElementById('newComment').value,
        date: document.getElementById('newDate').value
      };
      await fetch('/clients', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      fetchClients();
    }

    async function deleteClient(id) {
      await fetch(`/clients/${id}`, { method: 'DELETE' });
      fetchClients();
    }

    function renderChart(clients) {
      const counts = { green: 0, yellow: 0, red: 0 };
      clients.forEach(c => counts[c.status]++);

      const ctx = document.getElementById('statusChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Надёжные', 'Под наблюдением', 'Ненадёжные'],
          datasets: [{
            label: 'Количество пациентов',
            data: [counts.green, counts.yellow, counts.red],
            backgroundColor: ['#006400', '#999900', '#8B0000']
          }]
        }
      });
    }

    fetchClients();
  </script>
</body>
</html>
